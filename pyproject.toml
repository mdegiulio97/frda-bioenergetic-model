[project]
name = "frda-bioenergetic-model"
version = "0.1.0"
description = "Reduced mechanistic ODE model of Friedreich's ataxia cellular bioenergetics, calibrated on published data, and a JAX cross-scale progression model with identifiability and acquisition-design tools."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jax>=0.10,<0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "L2_methodology_POC/tests"]
pythonpath = ["pilot_L1_bioenergetic", "L2_methodology_POC"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "F841"]
